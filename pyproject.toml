    { name = "krishnatiwari005", email = "krishna.08072005@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "agno>=2.9.0",
    "chonkie[openai]>=1.7.0",
    "ddgs>=9.16.0",
    "groq>=1.6.0",
